# IPTCVD Pipeline — Max 20x tier manifest
#
# Sourced by install.sh, configure.sh and verify.sh.
#
# Max 20x: the full 24-agent roster from docs/DESIGN-RATIONALE.md. Every phase
# has its own playbook skill, VERIFY fans out to five read-only auditors from a
# single dispatch, debate escalates to three levels including agent teams, and
# the monthly /studio-report runs on OpenTelemetry data rather than anecdote.
#
# This tier costs real money. Install it because you can name the failure each
# extra agent prevents, not because the roster is longer.

