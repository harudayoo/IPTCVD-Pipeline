# IPTCVD Pipeline — Max tier manifest
#
# Sourced by install.sh, configure.sh and verify.sh.
#
# Max: the blueprint's "start with nine", plus qa-runner and security-auditor
# because verification that produces no evidence is not verification. A
# conductor owns phase order, IDEA becomes a real phase with its own artifact,
# and VERIFY fans out to three read-only reviewers in parallel instead of one
# reviewer anchoring on the first class of problem it finds.

TIER_ID="max"
TIER_NAME="Max"
TIER_TAGLINE="11 agents, conductor-routed, 3-way parallel verify"
TIER_BLURB="The nine-agent core plus evidence-producing verification. Adds the IDEA phase, a conductor that enforces phase order, and the two-proposal debate protocol for irreversible decisions."

TIER_AGENTS="conductor product-analyst system-architect red-team-critic test-designer backend-engineer frontend-engineer code-reviewer security-auditor qa-runner doc-writer"

TIER_SKILLS="feature debate handoff codebase-map design-tokens web-audit report ci-scaffold security-audit"

TIER_RULES="backend frontend database testing security devops"

TIER_PHASES="idea plan test create verify document"

TIER_OPUS_AGENTS="conductor system-architect red-team-critic security-auditor"

TIER_UI_AGENTS="frontend-engineer qa-runner"
TIER_UI_SKILLS="web-audit design-tokens"
TIER_UI_RULES="frontend"

TIER_EXTRA_CLAUDE_DIRS=""
TIER_EXTRA_DOC_DIRS="docs/design"

TIER_ENTRY_COMMAND="/feature <description>"
