# IPTCVD Pipeline — Pro tier manifest
#
# Sourced by install.sh, configure.sh and verify.sh. Everything that differs
# between plans is declared here; the installer itself has no per-tier logic.
#
# Pro: Opus and Sonnet share one usage pool. This roster spends Opus exactly
# once per feature, on the plan critique — the one place where a wrong answer
# is expensive to reverse. Everything else is Sonnet, sequential.

TIER_ID="pro"
TIER_NAME="Pro"
TIER_TAGLINE="7 agents, sequential, one Opus call per feature"
TIER_BLURB="Lean pipeline for a shared Opus/Sonnet pool. One agent per phase, no fan-out, no debate protocol. Roughly one context window per phase."

# Roster — names must match files in templates/agents/
TIER_AGENTS="planner critic test-designer implementer reviewer qa-runner doc-writer"

# Skills — names must match directories in templates/skills/
TIER_SKILLS="feature handoff codebase-map web-audit report ci-scaffold security-audit"

# Path-scoped rules — names must match files in templates/rules/
TIER_RULES="backend frontend testing security devops"

# Gate phases, in order. gate.json starts at 'idle'.
TIER_PHASES="plan critique test create verify document"

# Which agents run on Opus. Reported at install time so the cost is visible.
TIER_OPUS_AGENTS="critic"

# Dropped by configure.sh when the profile says the project has no UI.
TIER_UI_AGENTS="qa-runner"
TIER_UI_SKILLS="web-audit"
TIER_UI_RULES="frontend"

# Extra directories this tier needs beyond the standard scaffold.
TIER_EXTRA_CLAUDE_DIRS=""
TIER_EXTRA_DOC_DIRS=""

# Entry point shown in the post-install instructions.
TIER_ENTRY_COMMAND="/feature <description>"
